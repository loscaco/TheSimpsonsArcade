<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Simpsons Arcade - Konami Engine Pro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            color: #ffe600;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #arcade-container {
            position: relative;
            width: 896px; /* Relación de aspecto 16:9 optimizada para arcade */
            max-width: 100%;
            height: 504px;
            background: #000;
            border: 6px solid #111;
            box-shadow: 0 0 30px rgba(255, 230, 0, 0.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #111;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 25px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 3px 3px #000;
            pointer-events: none;
        }

        .controls-layer {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
            pointer-events: auto;
        }

        .d-pad, .action-pad {
            display: flex;
            gap: 12px;
        }

        .arcade-btn {
            background: rgba(255, 230, 0, 0.1);
            border: 2px solid #ffe600;
            color: #ffe600;
            padding: 16px 22px;
            font-family: inherit;
            font-weight: bold;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }

        .arcade-btn:active {
            background: rgba(255, 230, 0, 0.4);
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        .hidden { display: none !important; }

        .arcade-link {
            margin-top: 20px;
            background: #ffe600;
            color: #000;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: 0 4px 0 #cc9900;
        }
        .arcade-link:active { transform: translateY(2px); box-shadow: 0 2px 0 #cc9900; }
    </style>
</head>
<body>

    <div id="arcade-container">
        <canvas id="gameCanvas" width="896" height="504"></canvas>
        
        <!-- HUD Clásico Estilo Konami -->
        <div class="hud-overlay">
            <div id="hudScore">1UP: 000000</div>
            <div id="hudLives">HOMER: ❤️❤️❤️</div>
        </div>

        <!-- Menú Principal -->
        <div id="startScreen" class="screen-overlay">
            <h1 style="color: #ffe600; font-size: 36px; margin-bottom: 5px; text-shadow: 4px 4px #ff0000;">THE SIMPSONS</h1>
            <p style="color: #fff; font-size: 14px; letter-spacing: 2px; margin-bottom: 25px;">KONAMI ARCADE ENGINE - PRO EDITION</p>
            <button class="arcade-link" onclick="startGame()">PRESS START</button>
        </div>

        <!-- Pantalla de Game Over -->
        <div id="gameOverScreen" class="screen-overlay hidden">
            <h1 style="color: #ff2222; font-size: 38px; text-shadow: 3px 3px #000;">GAME OVER</h1>
            <p id="finalStats" style="color: #fff; margin: 15px 0; font-size: 16px;">FINAL SCORE: 0 | STAGE CLEAR: 0</p>
            <a id="shareBtn" class="arcade-link" href="#" target="_blank">SHARE SCORE ON X 🚀</a>
            <button class="arcade-link" style="background:#444; color:#fff; margin-top:12px; box-shadow:0 4px 0 #222;" onclick="resetGame()">CONTINUE</button>
        </div>

        <!-- Controles Táctiles Integrados -->
        <div class="controls-layer">
            <div class="d-pad">
                <button class="arcade-btn" id="btnLeft">◀</button>
                <button class="arcade-btn" id="btnRight">▶</button>
                <button class="arcade-btn" id="btnUp">▲</button>
                <button class="arcade-btn" id="btnDown">▼</button>
            </div>
            <div class="action-pad">
                <button class="arcade-btn" id="btnJump">JUMP</button>
                <button class="arcade-btn" id="btnPunch">ATTACK</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
